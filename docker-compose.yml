services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    # No ports needed here; Nginx talks to it internally
    restart: always

  backend:
    build: ./backend
    # No ports needed here; Nginx talks to it internally
    restart: always
