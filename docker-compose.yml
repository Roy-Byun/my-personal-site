services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    restart: always

  backend:
    build: ./backend
    # --- ADD THESE LINES FOR REAL-TIME STATS ---
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/myapp_db
      - PROCFS_PATH=/host/proc
    # ------------------------------------------
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] # Updated path
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=myapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
