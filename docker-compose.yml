services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_assets:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - personal_network

  frontend:
    build: ./frontend
    volumes:
      - frontend_assets:/usr/share/nginx/html
    restart: always
    networks:
      - personal_network

  backend:
    build: ./backend
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/myapp_db
      - PROCFS_PATH=/host/proc
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s # Increased interval
      timeout: 10s # Increased timeout
      retries: 5
      start_period: 20s # Added start period
    restart: always
    networks:
      - personal_network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=myapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - personal_network

volumes:
  postgres_data:
  frontend_assets:

networks:
  personal_network:
    external: true
