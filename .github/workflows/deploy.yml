name: Deploy to Mini PC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted # Runs on your Roika Mini PC

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Version Variables
        run: |
          VERSION="1.0.${{ github.run_number }}"
          DATE=$(TZ='Asia/Singapore' date +'%Y-%m-%d %H:%M')
          echo "Preparing Build: v$VERSION at $DATE"
          echo "VITE_APP_VERSION=$VERSION" > frontend/.env
          echo "VITE_APP_BUILD_DATE=$DATE" >> frontend/.env
          echo "REACT_APP_VERSION=$VERSION" >> frontend/.env
          echo "REACT_APP_BUILD_DATE=$DATE" >> frontend/.env

      - name: Write secrets to .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_FULL_NAME=${{ secrets.ADMIN_FULL_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          GITHUB_USERNAME=${{ secrets.GH_SYNC_USERNAME }}
          GITHUB_TOKEN=${{ secrets.GH_SYNC_TOKEN }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_STARTTLS=${{ secrets.SMTP_STARTTLS }}
          EOF

      - name: Build and Deploy
        run: |
          set -e
          # Build FIRST — if this fails (e.g. Docker Hub unreachable), the
          # running site is left completely untouched.
          built=0
          for i in 1 2 3; do
            if docker compose build frontend backend; then built=1; break; fi
            echo "Build attempt $i failed; retrying in 30s..."
            sleep 30
          done
          [ "$built" = 1 ] || { echo "All build attempts failed — deployment left as-is."; exit 1; }

          # Recreate only the containers whose image/config changed. No teardown,
          # no volume wipe — the frontend image refreshes the shared assets
          # volume itself on start (see frontend/Dockerfile).
          docker compose up -d --remove-orphans
          docker compose restart nginx
          docker image prune -f || true
          # Keep the build cache from growing without limit: the newest 2 GB
          # stays so the next build is still fast, older layers are dropped.
          docker builder prune -a -f --keep-storage 2GB || true
          docker system df || true
