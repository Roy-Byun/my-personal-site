name: Deploy — Self-hosted Mini PC
# This workflow deploys the application on the self-hosted runner (Mini PC).
# It expects the runner to have Docker and Docker Compose available.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose down
          docker compose build --no-cache frontend
          docker compose up -d
